<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">ACEHarness 核心亮点总览</title>
  <desc id="desc">六张亮点卡片展示 ACEHarness 的对话创建、Spec Coding、状态机、Supervisor、对抗式评审和工程可观测能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C31" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <style>
      .font { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
      .muted { fill: #CBD5E1; font-size: 17px; }
      .label { font-size: 14px; font-weight: 700; }
      .title { fill: #F8FAFC; font-size: 29px; font-weight: 700; }
      .chip { fill: #0B1220; stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="230" cy="150" r="270" fill="url(#glowBlue)"/>
  <circle cx="1360" cy="890" r="310" fill="url(#glowOrange)"/>
  <path d="M0 150C238 86 462 240 714 220C986 198 1194 92 1600 168V0H0Z" fill="#FFFFFF" fill-opacity="0.045"/>
  <path d="M0 858C292 756 560 920 824 884C1134 842 1340 716 1600 780V1040H0Z" fill="#FFFFFF" fill-opacity="0.035"/>

  <g class="font">
    <text x="80" y="126" fill="#F8FAFC" font-size="52" font-weight="800">ACEHarness 核心亮点</text>
    <text x="80" y="172" fill="#CBD5E1" font-size="20">从需求澄清到工作台运行，再到审查、恢复、复盘和团队知识沉淀。</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="80" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="80" y="250" width="7" height="266" rx="4" fill="#38BDF8"/>
    <circle cx="128" cy="300" r="19" fill="#0EA5E9" fill-opacity="0.20" stroke="#7DD3FC"/>
    <text x="128" y="307" text-anchor="middle" fill="#BAE6FD" font-size="17" font-weight="700">01</text>
    <text x="160" y="294" fill="#7DD3FC" class="label">CREATE WITH CHAT OR FORM</text>
    <text x="160" y="334" class="title">对话式与手动创建</text>
    <text x="128" y="378" class="muted">
      <tspan x="128" dy="0">首页对话可把自然语言需求收敛成工作流草案。</tspan>
      <tspan x="128" dy="28">手动创建适合明确模式、目录、引擎和运行参数。</tspan>
      <tspan x="128" dy="28">进入控制台后可通过 Onboarding 查看完整引导。</tspan>
    </text>
    <rect x="128" y="460" width="314" height="34" rx="17" class="chip"/>
    <text x="285" y="482" text-anchor="middle" fill="#BAE6FD" font-size="15" font-weight="700">会话动作确认 / 工作流草案 / 模板复用</text>

    <rect x="572" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="572" y="250" width="7" height="266" rx="4" fill="#F59E0B"/>
    <circle cx="620" cy="300" r="19" fill="#F59E0B" fill-opacity="0.20" stroke="#FCD34D"/>
    <text x="620" y="307" text-anchor="middle" fill="#FEF3C7" font-size="17" font-weight="700">02</text>
    <text x="652" y="294" fill="#FCD34D" class="label">SPEC CODING LOOP</text>
    <text x="652" y="334" class="title">Spec 与步骤绑定</text>
    <text x="620" y="378" class="muted">
      <tspan x="620" dy="0">requirements / design / tasks 先形成计划制品。</tspan>
      <tspan x="620" dy="28">创建工作流时建立步骤与任务的绑定关系。</tspan>
      <tspan x="620" dy="28">任务状态由系统维护，不依赖 Agent 文本勾选。</tspan>
    </text>
    <rect x="620" y="460" width="306" height="34" rx="17" class="chip"/>
    <text x="773" y="482" text-anchor="middle" fill="#FEF3C7" font-size="15" font-weight="700">运行态 Spec / 持久化同步 / 修订校验</text>

    <rect x="1064" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="1064" y="250" width="7" height="266" rx="4" fill="#22C55E"/>
    <circle cx="1112" cy="300" r="19" fill="#22C55E" fill-opacity="0.20" stroke="#86EFAC"/>
    <text x="1112" y="307" text-anchor="middle" fill="#DCFCE7" font-size="17" font-weight="700">03</text>
    <text x="1144" y="294" fill="#86EFAC" class="label">STATE MACHINE RUNTIME</text>
    <text x="1144" y="334" class="title">状态机驱动执行</text>
    <text x="1112" y="378" class="muted">
      <tspan x="1112" dy="0">每个状态可根据结构化 verdict 继续或回退。</tspan>
      <tspan x="1112" dy="28">人工检查点支持确认、反馈注入和强制跳转。</tspan>
      <tspan x="1112" dy="28">失败或服务重启后可从运行记录恢复。</tspan>
    </text>
    <rect x="1112" y="460" width="292" height="34" rx="17" class="chip"/>
    <text x="1258" y="482" text-anchor="middle" fill="#DCFCE7" font-size="15" font-weight="700">条件流转 / 检查点 / 恢复运行</text>

    <rect x="80" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="80" y="558" width="7" height="266" rx="4" fill="#A78BFA"/>
    <circle cx="128" cy="608" r="19" fill="#8B5CF6" fill-opacity="0.20" stroke="#C4B5FD"/>
    <text x="128" y="615" text-anchor="middle" fill="#EDE9FE" font-size="17" font-weight="700">04</text>
    <text x="160" y="602" fill="#C4B5FD" class="label">SUPERVISOR ROUTING</text>
    <text x="160" y="642" class="title">Supervisor 智能路由</text>
    <text x="128" y="686" class="muted">
      <tspan x="128" dy="0">Agent 只声明缺什么信息，不需要知道团队名单。</tspan>
      <tspan x="128" dy="28">Supervisor 通过关键词、轻量模型和用户兜底路由。</tspan>
      <tspan x="128" dy="28">Plan Loop 让执行前先补齐关键上下文。</tspan>
    </text>
    <rect x="128" y="768" width="306" height="34" rx="17" class="chip"/>
    <text x="281" y="790" text-anchor="middle" fill="#EDE9FE" font-size="15" font-weight="700">NEED_INFO / 路由回放 / 低成本协作</text>

    <rect x="572" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="572" y="558" width="7" height="266" rx="4" fill="#F43F5E"/>
    <circle cx="620" cy="608" r="19" fill="#F43F5E" fill-opacity="0.20" stroke="#FDA4AF"/>
    <text x="620" y="615" text-anchor="middle" fill="#FFE4E6" font-size="17" font-weight="700">05</text>
    <text x="652" y="602" fill="#FDA4AF" class="label">ADVERSARIAL REVIEW</text>
    <text x="652" y="642" class="title">红蓝对抗式评审</text>
    <text x="620" y="686" class="muted">
      <tspan x="620" dy="0">Defender 红队负责方案、实现和证据补齐。</tspan>
      <tspan x="620" dy="28">Attacker 蓝队主动攻击方案、审查质量和边界。</tspan>
      <tspan x="620" dy="28">Judge 输出结构化判决，驱动继续迭代或通过。</tspan>
    </text>
    <rect x="620" y="768" width="300" height="34" rx="17" class="chip"/>
    <text x="770" y="790" text-anchor="middle" fill="#FFE4E6" font-size="15" font-weight="700">Defender / Attacker / Judge</text>

    <rect x="1064" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="1064" y="558" width="7" height="266" rx="4" fill="#14B8A6"/>
    <circle cx="1112" cy="608" r="19" fill="#14B8A6" fill-opacity="0.20" stroke="#5EEAD4"/>
    <text x="1112" y="615" text-anchor="middle" fill="#CCFBF1" font-size="17" font-weight="700">06</text>
    <text x="1144" y="602" fill="#5EEAD4" class="label">OBSERVABILITY AND MEMORY</text>
    <text x="1144" y="642" class="title">可观测与知识沉淀</text>
    <text x="1112" y="686" class="muted">
      <tspan x="1112" dy="0">工作台展示流式输出、步骤结果、状态图和日志。</tspan>
      <tspan x="1112" dy="28">Dashboard 统计运行趋势、Token 成本和 Prompt 质量。</tspan>
      <tspan x="1112" dy="28">Workspace、Notebook、Skills 承接产物与团队经验。</tspan>
    </text>
    <rect x="1112" y="768" width="330" height="34" rx="17" class="chip"/>
    <text x="1277" y="790" text-anchor="middle" fill="#CCFBF1" font-size="15" font-weight="700">运行历史 / 成本追踪 / 资产复用</text>
  </g>

  <g class="font">
    <rect x="80" y="880" width="1440" height="74" rx="24" fill="#0B1220" fill-opacity="0.86" stroke="#334155"/>
    <text x="122" y="925" fill="#F8FAFC" font-size="21" font-weight="700">定位</text>
    <text x="188" y="925" fill="#CBD5E1" font-size="18">ACEHarness 面向真实工程任务，把创建、计划、执行、审查、恢复和复盘组织成可追踪的本地协作闭环。</text>
  </g>
</svg>
