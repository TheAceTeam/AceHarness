<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">ACEHarness Core Capabilities</title>
  <desc id="desc">Six capability cards showing requirements and plan modeling, workflow orchestration, multi-agent collaboration, knowledge capture, capability extension, and external channels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C31" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <style>
      .font { font-family: Arial, sans-serif; }
      .muted { fill: #CBD5E1; font-size: 15px; }
      .label { font-size: 14px; font-weight: 700; }
      .title { fill: #F8FAFC; font-size: 27px; font-weight: 700; }
      .chip { fill: #0B1220; stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="230" cy="150" r="270" fill="url(#glowBlue)"/>
  <circle cx="1360" cy="890" r="310" fill="url(#glowGreen)"/>
  <path d="M0 150C238 86 462 240 714 220C986 198 1194 92 1600 168V0H0Z" fill="#FFFFFF" fill-opacity="0.045"/>
  <path d="M0 858C292 756 560 920 824 884C1134 842 1340 716 1600 780V1040H0Z" fill="#FFFFFF" fill-opacity="0.035"/>

  <g class="font">
    <text x="80" y="126" fill="#F8FAFC" font-size="52" font-weight="800">ACEHarness Core Capabilities</text>
    <text x="80" y="172" fill="#CBD5E1" font-size="20">A local AI engineering loop for planning, execution, collaboration, knowledge, extension, and channels.</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="80" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="80" y="250" width="7" height="266" rx="4" fill="#38BDF8"/>
    <circle cx="128" cy="300" r="19" fill="#0EA5E9" fill-opacity="0.20" stroke="#7DD3FC"/>
    <text x="128" y="307" text-anchor="middle" fill="#BAE6FD" font-size="17" font-weight="700">01</text>
    <text x="160" y="294" fill="#7DD3FC" class="label">REQUIREMENTS AND PLAN</text>
    <text x="160" y="334" class="title">Requirements and Plan Modeling</text>
    <text x="128" y="378" class="muted">
      <tspan x="128" dy="0">Spec Driven Development starts from clarification.</tspan>
      <tspan x="128" dy="28">requirements / design / tasks become artifacts.</tspan>
      <tspan x="128" dy="28">Specs bind to workflow steps and execution.</tspan>
    </text>
    <rect x="128" y="460" width="306" height="34" rx="17" class="chip"/>
    <text x="281" y="482" text-anchor="middle" fill="#BAE6FD" font-size="14" font-weight="700">Reviewable plans / Task binding / Revision</text>

    <rect x="572" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="572" y="250" width="7" height="266" rx="4" fill="#22C55E"/>
    <circle cx="620" cy="300" r="19" fill="#22C55E" fill-opacity="0.20" stroke="#86EFAC"/>
    <text x="620" y="307" text-anchor="middle" fill="#DCFCE7" font-size="17" font-weight="700">02</text>
    <text x="652" y="294" fill="#86EFAC" class="label">WORKFLOW CONTROL</text>
    <text x="652" y="334" class="title">Workflow Orchestration</text>
    <text x="620" y="378" class="muted">
      <tspan x="620" dy="0">State machines model complex transitions.</tspan>
      <tspan x="620" dy="28">Supervisor routes context; adversarial iteration reviews quality.</tspan>
      <tspan x="620" dy="28">Parallel steps, Preflight, human gates, and Git checkpoints protect runs.</tspan>
    </text>
    <rect x="620" y="460" width="300" height="34" rx="17" class="chip"/>
    <text x="770" y="482" text-anchor="middle" fill="#DCFCE7" font-size="14" font-weight="700">Transitions / Supervisor / Adversarial review / Git</text>

    <rect x="1064" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="1064" y="250" width="7" height="266" rx="4" fill="#F59E0B"/>
    <circle cx="1112" cy="300" r="19" fill="#F59E0B" fill-opacity="0.20" stroke="#FCD34D"/>
    <text x="1112" y="307" text-anchor="middle" fill="#FEF3C7" font-size="17" font-weight="700">03</text>
    <text x="1144" y="294" fill="#FCD34D" class="label">MULTI-AGENT AGORA</text>
    <text x="1144" y="334" class="title">Multi-Agent Collaboration</text>
    <text x="1112" y="378" class="muted">
      <tspan x="1112" dy="0">Workflow Agora keeps execution discussion together.</tspan>
      <tspan x="1112" dy="28">Topic-mode Agora supports everyday decisions.</tspan>
      <tspan x="1112" dy="28">AI guests collaborate in a shared context.</tspan>
    </text>
    <rect x="1112" y="460" width="298" height="34" rx="17" class="chip"/>
    <text x="1261" y="482" text-anchor="middle" fill="#FEF3C7" font-size="14" font-weight="700">Workflow Agora / Topic rooms / Shared context</text>

    <rect x="80" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="80" y="558" width="7" height="266" rx="4" fill="#A78BFA"/>
    <circle cx="128" cy="608" r="19" fill="#8B5CF6" fill-opacity="0.20" stroke="#C4B5FD"/>
    <text x="128" y="615" text-anchor="middle" fill="#EDE9FE" font-size="17" font-weight="700">04</text>
    <text x="160" y="602" fill="#C4B5FD" class="label">MEMORY AND NOTEBOOK</text>
    <text x="160" y="642" class="title">Knowledge and Long-Term Context</text>
    <text x="128" y="686" class="muted">
      <tspan x="128" dy="0">Persistent memory spans roles, projects, workflows, chats.</tspan>
      <tspan x="128" dy="28">Later runs recall relevant experience.</tspan>
      <tspan x="128" dy="28">Cangjie Notebook captures docs, outputs, and retrospectives.</tspan>
    </text>
    <rect x="128" y="768" width="292" height="34" rx="17" class="chip"/>
    <text x="274" y="790" text-anchor="middle" fill="#EDE9FE" font-size="14" font-weight="700">Memory / Collaboration / Snapshots</text>

    <rect x="572" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="572" y="558" width="7" height="266" rx="4" fill="#F43F5E"/>
    <circle cx="620" cy="608" r="19" fill="#F43F5E" fill-opacity="0.20" stroke="#FDA4AF"/>
    <text x="620" y="615" text-anchor="middle" fill="#FFE4E6" font-size="17" font-weight="700">05</text>
    <text x="652" y="602" fill="#FDA4AF" class="label">EXTENSION AND GOVERNANCE</text>
    <text x="652" y="642" class="title">Extension and Model Governance</text>
    <text x="620" y="686" class="muted">
      <tspan x="620" dy="0">Skill Marketplace installs domain procedures.</tspan>
      <tspan x="620" dy="28">Skills can be imported, exported, synced, and injected.</tspan>
      <tspan x="620" dy="28">Diagnostics evaluate models, engines, and drivers.</tspan>
    </text>
    <rect x="620" y="768" width="286" height="34" rx="17" class="chip"/>
    <text x="763" y="790" text-anchor="middle" fill="#FFE4E6" font-size="14" font-weight="700">Skills / Probes / Driver diagnostics</text>

    <rect x="1064" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="1064" y="558" width="7" height="266" rx="4" fill="#14B8A6"/>
    <circle cx="1112" cy="608" r="19" fill="#14B8A6" fill-opacity="0.20" stroke="#5EEAD4"/>
    <text x="1112" y="615" text-anchor="middle" fill="#CCFBF1" font-size="17" font-weight="700">06</text>
    <text x="1144" y="602" fill="#5EEAD4" class="label">EXTERNAL CHANNELS</text>
    <text x="1144" y="642" class="title">External Channel Access</text>
    <text x="1112" y="686" class="muted">
      <tspan x="1112" dy="0">Home chat can bind WeChat ClawBot sessions.</tspan>
      <tspan x="1112" dy="28">External messages enter the same conversation context.</tspan>
      <tspan x="1112" dy="28">Workflow human gates can notify via WeChat and email.</tspan>
    </text>
    <rect x="1112" y="768" width="282" height="34" rx="17" class="chip"/>
    <text x="1253" y="790" text-anchor="middle" fill="#CCFBF1" font-size="14" font-weight="700">ClawBot / WeChat / Email</text>
  </g>

  <g class="font">
    <rect x="80" y="880" width="1440" height="74" rx="24" fill="#0B1220" fill-opacity="0.86" stroke="#334155"/>
    <text x="122" y="925" fill="#F8FAFC" font-size="21" font-weight="700">Positioning</text>
    <text x="244" y="925" fill="#CBD5E1" font-size="18">ACEHarness turns one-off AI chats into a local engineering system for planning, collaboration, governance, and knowledge.</text>
  </g>
</svg>
