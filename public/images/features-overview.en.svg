<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">ACEHarness Feature Highlights</title>
  <desc id="desc">Six highlight cards showing conversational creation, Spec Coding, state-machine execution, Supervisor routing, adversarial review, and engineering observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C31" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <style>
      .font { font-family: Arial, sans-serif; }
      .muted { fill: #CBD5E1; font-size: 15px; }
      .label { font-size: 14px; font-weight: 700; }
      .title { fill: #F8FAFC; font-size: 27px; font-weight: 700; }
      .chip { fill: #0B1220; stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="230" cy="150" r="270" fill="url(#glowBlue)"/>
  <circle cx="1360" cy="890" r="310" fill="url(#glowOrange)"/>
  <path d="M0 150C238 86 462 240 714 220C986 198 1194 92 1600 168V0H0Z" fill="#FFFFFF" fill-opacity="0.045"/>
  <path d="M0 858C292 756 560 920 824 884C1134 842 1340 716 1600 780V1040H0Z" fill="#FFFFFF" fill-opacity="0.035"/>

  <g class="font">
    <text x="80" y="126" fill="#F8FAFC" font-size="52" font-weight="800">ACEHarness Feature Highlights</text>
    <text x="80" y="172" fill="#CBD5E1" font-size="20">From planning to execution, review, recovery, retrospectives, and reusable team knowledge.</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="80" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="80" y="250" width="7" height="266" rx="4" fill="#38BDF8"/>
    <circle cx="128" cy="300" r="19" fill="#0EA5E9" fill-opacity="0.20" stroke="#7DD3FC"/>
    <text x="128" y="307" text-anchor="middle" fill="#BAE6FD" font-size="17" font-weight="700">01</text>
    <text x="160" y="294" fill="#7DD3FC" class="label">CREATE WITH CHAT OR FORM</text>
    <text x="160" y="334" class="title">Chat and Manual Creation</text>
    <text x="128" y="378" class="muted">
      <tspan x="128" dy="0">Home chat turns requests into workflow drafts.</tspan>
      <tspan x="128" dy="28">Manual forms cover modes, directories, and engines.</tspan>
      <tspan x="128" dy="28">Onboarding guides the full product path.</tspan>
    </text>
    <rect x="128" y="460" width="270" height="34" rx="17" class="chip"/>
    <text x="263" y="482" text-anchor="middle" fill="#BAE6FD" font-size="14" font-weight="700">Confirmations / Drafts / Templates</text>

    <rect x="572" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="572" y="250" width="7" height="266" rx="4" fill="#F59E0B"/>
    <circle cx="620" cy="300" r="19" fill="#F59E0B" fill-opacity="0.20" stroke="#FCD34D"/>
    <text x="620" y="307" text-anchor="middle" fill="#FEF3C7" font-size="17" font-weight="700">02</text>
    <text x="652" y="294" fill="#FCD34D" class="label">SPEC CODING LOOP</text>
    <text x="652" y="334" class="title">Spec and Step Binding</text>
    <text x="620" y="378" class="muted">
      <tspan x="620" dy="0">requirements / design / tasks become artifacts.</tspan>
      <tspan x="620" dy="28">Workflow steps bind to Spec tasks before runs.</tspan>
      <tspan x="620" dy="28">Task state is maintained by the system.</tspan>
    </text>
    <rect x="620" y="460" width="292" height="34" rx="17" class="chip"/>
    <text x="766" y="482" text-anchor="middle" fill="#FEF3C7" font-size="14" font-weight="700">Runtime Spec / Persistence / Checks</text>

    <rect x="1064" y="250" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="1064" y="250" width="7" height="266" rx="4" fill="#22C55E"/>
    <circle cx="1112" cy="300" r="19" fill="#22C55E" fill-opacity="0.20" stroke="#86EFAC"/>
    <text x="1112" y="307" text-anchor="middle" fill="#DCFCE7" font-size="17" font-weight="700">03</text>
    <text x="1144" y="294" fill="#86EFAC" class="label">STATE MACHINE RUNTIME</text>
    <text x="1144" y="334" class="title">State-Machine Execution</text>
    <text x="1112" y="378" class="muted">
      <tspan x="1112" dy="0">States continue or roll back by verdict.</tspan>
      <tspan x="1112" dy="28">Checkpoints support approval and feedback.</tspan>
      <tspan x="1112" dy="28">Interrupted runs resume from records.</tspan>
    </text>
    <rect x="1112" y="460" width="248" height="34" rx="17" class="chip"/>
    <text x="1236" y="482" text-anchor="middle" fill="#DCFCE7" font-size="14" font-weight="700">Transitions / Gates / Resume</text>

    <rect x="80" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="80" y="558" width="7" height="266" rx="4" fill="#A78BFA"/>
    <circle cx="128" cy="608" r="19" fill="#8B5CF6" fill-opacity="0.20" stroke="#C4B5FD"/>
    <text x="128" y="615" text-anchor="middle" fill="#EDE9FE" font-size="17" font-weight="700">04</text>
    <text x="160" y="602" fill="#C4B5FD" class="label">SUPERVISOR ROUTING</text>
    <text x="160" y="642" class="title">Supervisor Smart Routing</text>
    <text x="128" y="686" class="muted">
      <tspan x="128" dy="0">Agents declare missing information.</tspan>
      <tspan x="128" dy="28">Supervisor routes by keywords, models, or users.</tspan>
      <tspan x="128" dy="28">Plan Loop gathers context before execution.</tspan>
    </text>
    <rect x="128" y="768" width="260" height="34" rx="17" class="chip"/>
    <text x="258" y="790" text-anchor="middle" fill="#EDE9FE" font-size="14" font-weight="700">NEED_INFO / Replay / Low-cost</text>

    <rect x="572" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="572" y="558" width="7" height="266" rx="4" fill="#F43F5E"/>
    <circle cx="620" cy="608" r="19" fill="#F43F5E" fill-opacity="0.20" stroke="#FDA4AF"/>
    <text x="620" y="615" text-anchor="middle" fill="#FFE4E6" font-size="17" font-weight="700">05</text>
    <text x="652" y="602" fill="#FDA4AF" class="label">ADVERSARIAL REVIEW</text>
    <text x="652" y="642" class="title">Red/Blue Team Review</text>
    <text x="620" y="686" class="muted">
      <tspan x="620" dy="0">Defender protects plans and evidence.</tspan>
      <tspan x="620" dy="28">Attacker challenges quality and risks.</tspan>
      <tspan x="620" dy="28">Judge decides whether to pass or iterate.</tspan>
    </text>
    <rect x="620" y="768" width="250" height="34" rx="17" class="chip"/>
    <text x="745" y="790" text-anchor="middle" fill="#FFE4E6" font-size="14" font-weight="700">Defender / Attacker / Judge</text>

    <rect x="1064" y="558" width="456" height="266" rx="26" fill="url(#panel)" stroke="#334155"/>
    <rect x="1064" y="558" width="7" height="266" rx="4" fill="#14B8A6"/>
    <circle cx="1112" cy="608" r="19" fill="#14B8A6" fill-opacity="0.20" stroke="#5EEAD4"/>
    <text x="1112" y="615" text-anchor="middle" fill="#CCFBF1" font-size="17" font-weight="700">06</text>
    <text x="1144" y="602" fill="#5EEAD4" class="label">OBSERVE AND LEARN</text>
    <text x="1144" y="642" class="title">Observability and Memory</text>
    <text x="1112" y="686" class="muted">
      <tspan x="1112" dy="0">Workbench shows streams, graphs, and logs.</tspan>
      <tspan x="1112" dy="28">Dashboard tracks cost and prompt quality.</tspan>
      <tspan x="1112" dy="28">Assets preserve outputs and team knowledge.</tspan>
    </text>
    <rect x="1112" y="768" width="252" height="34" rx="17" class="chip"/>
    <text x="1238" y="790" text-anchor="middle" fill="#CCFBF1" font-size="14" font-weight="700">History / Cost / Assets</text>
  </g>

  <g class="font">
    <rect x="80" y="880" width="1440" height="74" rx="24" fill="#0B1220" fill-opacity="0.86" stroke="#334155"/>
    <text x="122" y="925" fill="#F8FAFC" font-size="21" font-weight="700">Positioning</text>
    <text x="244" y="925" fill="#CBD5E1" font-size="18">ACEHarness turns planning, execution, review, recovery, and retrospectives into a local engineering loop.</text>
  </g>
</svg>
