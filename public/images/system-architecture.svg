<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">系统架构</title>
  <desc id="desc">展示平台从浏览器前端、服务入口、业务服务、运行执行到本地数据和外部接入的模块架构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="48%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow" x="-14%" y="-16%" width="128%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#34D399"/>
    </marker>
    <style>
      .font { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
      .eyebrow { fill: #7DD3FC; font-size: 18px; font-weight: 800; letter-spacing: 0.14em; }
      .title { fill: #F8FAFC; font-size: 58px; font-weight: 800; }
      .subtitle { fill: #CBD5E1; font-size: 21px; }
      .cardTitle { fill: #F8FAFC; font-size: 28px; font-weight: 800; }
      .cardDesc { fill: #C7D2FE; font-size: 16px; font-weight: 700; }
      .module { fill: #E2E8F0; font-size: 16px; font-weight: 800; }
      .moduleSmall { fill: #E2E8F0; font-size: 15px; font-weight: 800; }
      .note { fill: #CBD5E1; font-size: 15px; font-weight: 800; }
      .label { fill: #BAE6FD; font-size: 14px; font-weight: 800; }
      .dataTitle { fill: #F8FAFC; font-size: 23px; font-weight: 800; }
      .dataText { fill: #D1FAE5; font-size: 15px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="url(#bg)"/>
  <path d="M0 118C230 64 414 136 650 108C918 76 1174 50 1600 112V0H0Z" fill="#FFFFFF" fill-opacity="0.045"/>
  <path d="M0 1052C252 988 470 1072 724 1034C1038 988 1304 968 1600 1018V1180H0Z" fill="#FFFFFF" fill-opacity="0.035"/>

  <g class="font">
    <text x="76" y="86" class="eyebrow">本地智能体工程平台</text>
    <text x="76" y="152" class="title">系统架构</text>
    <text x="76" y="194" class="subtitle">从前端工作台进入服务入口，业务服务统一编排任务、协作、文档和渠道，再交给运行核心调度多种执行后端并沉淀本地数据。</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M384 472H430" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M704 472H756" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M1134 472H1186" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M1328 306C1376 236 1142 214 916 214C584 214 362 224 276 304" stroke="#38BDF8" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrowBlue)"/>
    <path d="M944 842V922" stroke="#34D399" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <path d="M1356 842C1328 905 1224 918 1100 934" stroke="#34D399" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <path d="M558 922C616 868 704 836 816 824" stroke="#34D399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="76" y="250" width="308" height="598" rx="30" fill="url(#card)" stroke="#29415E"/>
    <rect x="76" y="250" width="308" height="6" rx="3" fill="#38BDF8"/>
    <text x="112" y="306" class="cardTitle">浏览器前端</text>
    <text x="112" y="336" class="cardDesc">用户操作与可视化反馈</text>

    <rect x="112" y="378" width="236" height="46" rx="16" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
    <text x="230" y="407" text-anchor="middle" class="module">首页对话</text>
    <rect x="112" y="444" width="236" height="46" rx="16" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
    <text x="230" y="473" text-anchor="middle" class="module">工作流工作台</text>
    <rect x="112" y="510" width="236" height="46" rx="16" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
    <text x="230" y="539" text-anchor="middle" class="module">议场协作</text>
    <rect x="112" y="576" width="236" height="46" rx="16" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
    <text x="230" y="605" text-anchor="middle" class="module">笔记本编辑</text>
    <rect x="112" y="642" width="236" height="46" rx="16" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
    <text x="230" y="671" text-anchor="middle" class="module">工作区与变更</text>
    <rect x="112" y="708" width="236" height="46" rx="16" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
    <text x="230" y="737" text-anchor="middle" class="module">设置与诊断</text>

    <rect x="112" y="786" width="236" height="32" rx="16" fill="#082F49" stroke="#0369A1"/>
    <text x="230" y="807" text-anchor="middle" class="note">接收流式状态与运行结果</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="430" y="250" width="274" height="598" rx="30" fill="url(#card)" stroke="#29415E"/>
    <rect x="430" y="250" width="274" height="6" rx="3" fill="#22C55E"/>
    <text x="466" y="306" class="cardTitle">服务入口</text>
    <text x="466" y="336" class="cardDesc">启动、路由、鉴权与长连接</text>

    <rect x="466" y="378" width="202" height="44" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#86EFAC"/>
    <text x="567" y="406" text-anchor="middle" class="module">自定义服务启动</text>
    <rect x="466" y="440" width="202" height="44" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#86EFAC"/>
    <text x="567" y="468" text-anchor="middle" class="module">页面路由</text>
    <rect x="466" y="502" width="202" height="44" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#86EFAC"/>
    <text x="567" y="530" text-anchor="middle" class="module">接口路由</text>
    <rect x="466" y="564" width="202" height="44" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#86EFAC"/>
    <text x="567" y="592" text-anchor="middle" class="module">鉴权中间件</text>
    <rect x="466" y="626" width="202" height="44" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#86EFAC"/>
    <text x="567" y="654" text-anchor="middle" class="module">协作长连接</text>
    <rect x="466" y="688" width="202" height="44" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#86EFAC"/>
    <text x="567" y="716" text-anchor="middle" class="module">流式事件</text>

    <rect x="466" y="786" width="202" height="32" rx="16" fill="#052E16" stroke="#16A34A"/>
    <text x="567" y="807" text-anchor="middle" class="note">统一收口前端请求</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="756" y="250" width="378" height="598" rx="30" fill="url(#card)" stroke="#29415E"/>
    <rect x="756" y="250" width="378" height="6" rx="3" fill="#A78BFA"/>
    <text x="792" y="306" class="cardTitle">业务服务</text>
    <text x="792" y="336" class="cardDesc">任务、对话、协作、文档与治理</text>

    <rect x="792" y="378" width="150" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="867" y="406" text-anchor="middle" class="moduleSmall">对话会话</text>
    <rect x="958" y="378" width="140" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="1028" y="406" text-anchor="middle" class="moduleSmall">工作流管理</text>
    <rect x="792" y="440" width="150" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="867" y="468" text-anchor="middle" class="moduleSmall">状态机执行</text>
    <rect x="958" y="440" width="140" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="1028" y="468" text-anchor="middle" class="moduleSmall">规范开发</text>
    <rect x="792" y="502" width="150" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="867" y="530" text-anchor="middle" class="moduleSmall">议场协作</text>
    <rect x="958" y="502" width="140" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="1028" y="530" text-anchor="middle" class="moduleSmall">笔记本管理</text>
    <rect x="792" y="564" width="150" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="867" y="592" text-anchor="middle" class="moduleSmall">工作区文件</text>
    <rect x="958" y="564" width="140" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="1028" y="592" text-anchor="middle" class="moduleSmall">渠道网关</text>
    <rect x="792" y="626" width="150" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="867" y="654" text-anchor="middle" class="moduleSmall">能力市场</text>
    <rect x="958" y="626" width="140" height="44" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="1028" y="654" text-anchor="middle" class="moduleSmall">模型诊断</text>

    <rect x="792" y="714" width="306" height="58" rx="18" fill="url(#core)" stroke="#BAE6FD"/>
    <text x="945" y="741" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800">服务端核心总线</text>
    <text x="945" y="764" text-anchor="middle" fill="#DBEAFE" font-size="14" font-weight="800">统一任务上下文、权限、事件和结果</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="1186" y="250" width="338" height="598" rx="30" fill="url(#card)" stroke="#29415E"/>
    <rect x="1186" y="250" width="338" height="6" rx="3" fill="#F59E0B"/>
    <text x="1222" y="306" class="cardTitle">运行与执行</text>
    <text x="1222" y="336" class="cardDesc">调度、进程、引擎选择与恢复</text>

    <rect x="1222" y="378" width="266" height="44" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#FCD34D"/>
    <text x="1355" y="406" text-anchor="middle" class="module">调度器</text>
    <rect x="1222" y="440" width="266" height="44" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#FCD34D"/>
    <text x="1355" y="468" text-anchor="middle" class="module">进程管理器</text>
    <rect x="1222" y="502" width="266" height="44" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#FCD34D"/>
    <text x="1355" y="530" text-anchor="middle" class="module">引擎工厂</text>
    <rect x="1222" y="564" width="266" height="44" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#FCD34D"/>
    <text x="1355" y="592" text-anchor="middle" class="module">上下文恢复</text>
    <rect x="1222" y="626" width="266" height="44" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#FCD34D"/>
    <text x="1355" y="654" text-anchor="middle" class="module">结果归一化</text>

    <rect x="1222" y="710" width="122" height="44" rx="15" fill="#7C2D12" fill-opacity="0.22" stroke="#FDBA74"/>
    <text x="1283" y="738" text-anchor="middle" class="moduleSmall">命令行后端</text>
    <rect x="1366" y="710" width="122" height="44" rx="15" fill="#7C2D12" fill-opacity="0.22" stroke="#FDBA74"/>
    <text x="1427" y="738" text-anchor="middle" class="moduleSmall">开发包后端</text>
    <rect x="1222" y="770" width="122" height="44" rx="15" fill="#7C2D12" fill-opacity="0.22" stroke="#FDBA74"/>
    <text x="1283" y="798" text-anchor="middle" class="moduleSmall">协议后端</text>
    <rect x="1366" y="770" width="122" height="44" rx="15" fill="#7C2D12" fill-opacity="0.22" stroke="#FDBA74"/>
    <text x="1427" y="798" text-anchor="middle" class="moduleSmall">多模型服务</text>
  </g>

  <g class="font">
    <text x="405" y="446" text-anchor="middle" class="label">请求进入</text>
    <text x="730" y="446" text-anchor="middle" class="label">路由分发</text>
    <text x="1160" y="446" text-anchor="middle" class="label">执行调度</text>
    <text x="860" y="230" text-anchor="middle" class="label">状态回传</text>
    <text x="630" y="898" text-anchor="middle" class="label">渠道消息</text>
    <text x="1010" y="898" text-anchor="middle" class="label">本地持久化</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="76" y="922" width="1448" height="156" rx="32" fill="url(#data)" stroke="#36516D"/>
    <text x="112" y="970" class="dataTitle">本地数据与外部接入</text>
    <text x="112" y="1000" fill="#CBD5E1" font-size="16" font-weight="800">运行配置、记录、日志、工作区、笔记本、能力包与渠道会话在本地持久化；外部消息经渠道网关进入同一上下文。</text>

    <rect x="112" y="1028" width="82" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="153" y="1049" text-anchor="middle" class="dataText">配置</text>
    <rect x="208" y="1028" width="82" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="249" y="1049" text-anchor="middle" class="dataText">数据</text>
    <rect x="304" y="1028" width="82" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="345" y="1049" text-anchor="middle" class="dataText">缓存</text>
    <rect x="400" y="1028" width="82" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="441" y="1049" text-anchor="middle" class="dataText">日志</text>
    <rect x="496" y="1028" width="96" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="544" y="1049" text-anchor="middle" class="dataText">工作区</text>
    <rect x="606" y="1028" width="110" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="661" y="1049" text-anchor="middle" class="dataText">运行记录</text>
    <rect x="730" y="1028" width="96" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="778" y="1049" text-anchor="middle" class="dataText">笔记本</text>
    <rect x="840" y="1028" width="96" height="32" rx="16" fill="#064E3B" stroke="#34D399"/>
    <text x="888" y="1049" text-anchor="middle" class="dataText">能力包</text>

    <rect x="1020" y="1028" width="82" height="32" rx="16" fill="#7C2D12" stroke="#FDBA74"/>
    <text x="1061" y="1049" text-anchor="middle" fill="#FED7AA" font-size="15" font-weight="800">微信</text>
    <rect x="1116" y="1028" width="82" height="32" rx="16" fill="#7C2D12" stroke="#FDBA74"/>
    <text x="1157" y="1049" text-anchor="middle" fill="#FED7AA" font-size="15" font-weight="800">飞书</text>
    <rect x="1212" y="1028" width="82" height="32" rx="16" fill="#7C2D12" stroke="#FDBA74"/>
    <text x="1253" y="1049" text-anchor="middle" fill="#FED7AA" font-size="15" font-weight="800">钉钉</text>
    <rect x="1308" y="1028" width="82" height="32" rx="16" fill="#7C2D12" stroke="#FDBA74"/>
    <text x="1349" y="1049" text-anchor="middle" fill="#FED7AA" font-size="15" font-weight="800">邮件</text>
    <rect x="1404" y="1028" width="84" height="32" rx="16" fill="#7C2D12" stroke="#FDBA74"/>
    <text x="1446" y="1049" text-anchor="middle" fill="#FED7AA" font-size="15" font-weight="800">回调</text>
  </g>

  <g class="font">
    <rect x="282" y="1110" width="1036" height="44" rx="22" fill="#08111F" stroke="#334155"/>
    <text x="800" y="1138" text-anchor="middle" fill="#CBD5E1" font-size="16" font-weight="800">主链路：前端操作 → 服务入口 → 业务编排 → 运行执行 → 本地沉淀；状态与结果再回到前端</text>
  </g>
</svg>
