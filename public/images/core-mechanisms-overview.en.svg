<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ACEHarness Engineering Loop</title>
  <desc id="desc">Shows the ACEHarness engineering loop composed of Spec planning, state-machine execution, Agora collaboration, Git checkpoints, memory, and diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C31" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="52%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-14%" y="-18%" width="128%" height="148%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9Z" fill="#64748B"/>
    </marker>
    <style>
      .font { font-family: Arial, sans-serif; }
      .title { fill: #F8FAFC; font-size: 32px; font-weight: 800; }
      .subtitle { fill: #CBD5E1; font-size: 16px; }
      .h { fill: #F8FAFC; font-size: 21px; font-weight: 800; }
      .p { fill: #CBD5E1; font-size: 14px; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <circle cx="150" cy="95" r="240" fill="url(#glowBlue)"/>
  <circle cx="1040" cy="620" r="280" fill="url(#glowGreen)"/>
  <path d="M0 106C210 42 370 164 570 150C780 134 938 44 1200 102V0H0Z" fill="#FFFFFF" fill-opacity="0.045"/>
  <path d="M0 560C226 486 420 606 626 576C858 542 1010 486 1200 522V680H0Z" fill="#FFFFFF" fill-opacity="0.035"/>

  <rect x="34" y="34" width="1132" height="612" rx="26" fill="#0B1220" fill-opacity="0.72" stroke="#334155"/>
  <g class="font">
    <text x="70" y="86" class="title">ACEHarness Engineering Loop</text>
    <text x="70" y="120" class="subtitle">A governed local multi-agent work system for planning, state-machine execution, collaboration, checkpoints, memory, and diagnostics.</text>
  </g>

  <g transform="translate(0,-10)">
    <g stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
      <path d="M414 238C492 198 708 198 786 238" marker-end="url(#loopArrow)"/>
      <path d="M980 346C1008 374 1008 402 980 430" marker-end="url(#loopArrow)"/>
      <path d="M786 522C708 562 492 562 414 522" marker-end="url(#loopArrow)"/>
      <path d="M220 430C192 402 192 374 220 346" marker-end="url(#loopArrow)"/>
    </g>

    <g filter="url(#shadow)">
      <circle cx="600" cy="370" r="118" fill="url(#center)"/>
      <circle cx="600" cy="370" r="90" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <circle cx="600" cy="370" r="132" stroke="#38BDF8" stroke-opacity="0.20" stroke-width="2"/>
      <text x="600" y="336" text-anchor="middle" fill="#FFFFFF" class="font" font-size="27" font-weight="800">Engineering Loop</text>
      <text x="600" y="371" text-anchor="middle" fill="#DBEAFE" class="font" font-size="15">Plan / Run / Agora / Memory</text>
      <rect x="509" y="394" width="182" height="34" rx="17" fill="#0B1220" fill-opacity="0.36" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="600" y="416" text-anchor="middle" fill="#FFFFFF" class="font" font-size="15" font-weight="800">Git-backed control</text>
    </g>

    <g class="font" filter="url(#shadow)">
      <rect x="72" y="174" width="330" height="154" rx="20" fill="url(#panel)" stroke="#334155"/>
      <rect x="72" y="174" width="7" height="154" rx="4" fill="#38BDF8"/>
      <text x="108" y="218" fill="#7DD3FC" font-size="13" font-weight="800">01  PLAN</text>
      <text x="108" y="254" class="h">Spec-driven plans</text>
      <text x="108" y="284" class="p">requirements / design / tasks</text>
      <text x="108" y="310" class="p">Bound to workflow steps and execution</text>

      <rect x="798" y="174" width="330" height="154" rx="20" fill="url(#panel)" stroke="#334155"/>
      <rect x="798" y="174" width="7" height="154" rx="4" fill="#22C55E"/>
      <text x="834" y="218" fill="#86EFAC" font-size="13" font-weight="800">02  RUN</text>
      <text x="834" y="254" class="h">State-machine control</text>
      <text x="834" y="284" class="p">Advanced transitions, parallel steps, Supervisor routing</text>
      <text x="834" y="310" class="p">Adversarial iteration, Preflight, Git checkpoints</text>

      <rect x="72" y="440" width="330" height="154" rx="20" fill="url(#panel)" stroke="#334155"/>
      <rect x="72" y="440" width="7" height="154" rx="4" fill="#F59E0B"/>
      <text x="108" y="484" fill="#FCD34D" font-size="13" font-weight="800">03  AGORA</text>
      <text x="108" y="520" class="h">Multi-agent collaboration</text>
      <text x="108" y="550" class="p">Workflow Agora and topic rooms</text>
      <text x="108" y="576" class="p">Plans, disagreements, context, retrospectives</text>

      <rect x="798" y="440" width="330" height="154" rx="20" fill="url(#panel)" stroke="#334155"/>
      <rect x="798" y="440" width="7" height="154" rx="4" fill="#A78BFA"/>
      <text x="834" y="484" fill="#C4B5FD" font-size="13" font-weight="800">04  LEARN</text>
      <text x="834" y="520" class="h">Knowledge and governance</text>
      <text x="834" y="550" class="p">Layered memory and Notebook</text>
      <text x="834" y="576" class="p">Skill Marketplace, diagnostics, channels</text>
    </g>

    <g class="font">
      <rect x="324" y="604" width="552" height="42" rx="21" fill="#0B1220" fill-opacity="0.92" stroke="#334155"/>
      <text x="600" y="631" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="800">Spec keeps plans traceable; runtime owns state; memory keeps experience reusable</text>
    </g>
  </g>
</svg>
