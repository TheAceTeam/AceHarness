<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ACEHarness Core Mechanism Workbench</title>
  <desc id="desc">A control-console composition showing ACEHarness Spec planning, state-machine runtime, Supervisor governance, collaborative memory, extension diagnostics, and channel integration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="46%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#101525"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C31" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#08101F" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2A44" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#22C55E"/>
      <stop offset="72%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="142%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9Z" fill="#94A3B8"/>
    </marker>
    <style>
      .font { font-family: Arial, sans-serif; }
      .title { fill: #F8FAFC; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #CBD5E1; font-size: 16px; }
      .kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
      .h { fill: #F8FAFC; font-size: 22px; font-weight: 800; }
      .p { fill: #CBD5E1; font-size: 13.5px; }
      .tiny { fill: #94A3B8; font-size: 12px; font-weight: 700; }
      .chip { fill: #E2E8F0; font-size: 12px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="820" rx="30" fill="url(#grid)"/>
  <path d="M0 118C220 68 347 128 536 116C772 101 905 50 1200 91V0H0Z" fill="#FFFFFF" fill-opacity="0.04"/>
  <path d="M0 712C220 656 392 732 612 704C842 674 1006 626 1200 664V820H0Z" fill="#FFFFFF" fill-opacity="0.035"/>

  <g class="font">
    <text x="70" y="82" class="title">ACEHarness Core Mechanism Workbench</text>
    <text x="70" y="116" class="subtitle">A control plane for the cover themes: Spec/state machine, Supervisor review, Agora/Notebook, model engines, and channel governance.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="150" width="1084" height="596" rx="28" fill="#0B1220" fill-opacity="0.82" stroke="#23324A"/>
    <path d="M98 190H1102" stroke="url(#spine)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="98" cy="190" r="8" fill="#38BDF8"/>
    <circle cx="394" cy="190" r="8" fill="#22C55E"/>
    <circle cx="806" cy="190" r="8" fill="#F97316"/>
    <circle cx="1102" cy="190" r="8" fill="#A78BFA"/>
    <text x="114" y="178" fill="#7DD3FC" class="tiny">SPEC PLANE</text>
    <text x="410" y="178" fill="#86EFAC" class="tiny">STATE RUNTIME</text>
    <text x="822" y="178" fill="#FDBA74" class="tiny">SUPERVISOR GATES</text>
    <text x="960" y="216" fill="#C4B5FD" class="tiny">KNOWLEDGE / OPS</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="82" y="230" width="286" height="320" rx="20" fill="url(#panel)" stroke="#2A3A55"/>
    <rect x="82" y="230" width="286" height="4" rx="2" fill="#38BDF8"/>
    <text x="106" y="270" fill="#7DD3FC" class="kicker">01  SPEC DRIVEN</text>
    <text x="106" y="306" class="h">Planning Plane</text>

    <g>
      <rect x="106" y="330" width="70" height="78" rx="12" fill="#E0F2FE" fill-opacity="0.95"/>
      <rect x="196" y="330" width="70" height="78" rx="12" fill="#DBEAFE" fill-opacity="0.95"/>
      <rect x="286" y="330" width="58" height="78" rx="12" fill="#DCFCE7" fill-opacity="0.95"/>
      <text x="141" y="358" text-anchor="middle" fill="#991B1B" font-size="12" font-weight="800">Reqs</text>
      <text x="231" y="358" text-anchor="middle" fill="#1D4ED8" font-size="12" font-weight="800">Design</text>
      <text x="315" y="358" text-anchor="middle" fill="#166534" font-size="12" font-weight="800">Tasks</text>
      <path d="M120 374H162M120 388H154M210 374H252M210 388H246M299 374H331M299 388H326" stroke="#64748B" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="106" y="440" class="p">Clarify requirements into formal plans</text>
    <text x="106" y="466" class="p">Bind specs to workflow execution</text>
    <text x="106" y="492" class="p">Reviewable, traceable, iterative</text>
    <rect x="106" y="512" width="190" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="201" y="531" text-anchor="middle" class="chip">requirements / design / tasks</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="398" y="214" width="396" height="356" rx="22" fill="url(#panel)" stroke="#2A3A55"/>
    <rect x="398" y="214" width="396" height="4" rx="2" fill="#22C55E"/>
    <text x="426" y="254" fill="#86EFAC" class="kicker">02  STATE MACHINE WORKFLOW</text>
    <text x="426" y="290" class="h">Runtime Core</text>

    <rect x="426" y="312" width="340" height="172" rx="16" fill="#050A14" stroke="#334155"/>
    <path d="M462 392H544M544 392V350H622M544 392V434H622M622 350H696M622 434H696M696 350V392H734M696 434V392H734" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="452" y="376" width="64" height="32" rx="16" fill="#0EA5E9" fill-opacity="0.28" stroke="#7DD3FC"/>
    <text x="484" y="397" text-anchor="middle" fill="#E0F2FE" font-size="12" font-weight="800">Start</text>
    <rect x="594" y="334" width="70" height="32" rx="10" fill="#22C55E" fill-opacity="0.22" stroke="#86EFAC"/>
    <text x="629" y="355" text-anchor="middle" fill="#DCFCE7" font-size="12" font-weight="800">Build</text>
    <rect x="594" y="418" width="70" height="32" rx="10" fill="#A78BFA" fill-opacity="0.22" stroke="#C4B5FD"/>
    <text x="629" y="439" text-anchor="middle" fill="#F5F3FF" font-size="12" font-weight="800">Review</text>
    <path d="M706 376L724 394L706 412L688 394Z" fill="#F59E0B" fill-opacity="0.24" stroke="#FCD34D"/>
    <text x="706" y="399" text-anchor="middle" fill="#FEF3C7" font-size="13" font-weight="900">?</text>
    <rect x="734" y="376" width="28" height="32" rx="8" fill="#22C55E" fill-opacity="0.24" stroke="#86EFAC"/>
    <text x="748" y="397" text-anchor="middle" fill="#DCFCE7" font-size="11" font-weight="800">Go</text>
    <path d="M516 460C486 472 462 462 462 436" stroke="#F97316" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="468" y="466" fill="#FDBA74" font-size="11" font-weight="800">Retry / Rollback</text>
    <rect x="646" y="454" width="86" height="20" rx="10" fill="#0F172A" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="689" y="468" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="800">Parallel</text>

    <text x="426" y="512" class="p">Conditions and priorities drive branch, retry, rollback</text>
    <text x="426" y="538" class="p">Parallel agent steps aggregate before transition</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="824" y="230" width="294" height="320" rx="20" fill="url(#panel)" stroke="#2A3A55"/>
    <rect x="824" y="230" width="294" height="4" rx="2" fill="#EF4444"/>
    <text x="848" y="270" fill="#FCA5A5" class="kicker">03  SUPERVISOR + REVIEW</text>
    <text x="848" y="306" class="h">Governance Gates</text>

    <rect x="858" y="330" width="226" height="38" rx="19" fill="#1D4ED8" fill-opacity="0.28" stroke="#60A5FA"/>
    <text x="971" y="354" text-anchor="middle" fill="#DBEAFE" font-size="14" font-weight="800">Supervisor Router</text>
    <path d="M971 368V394M971 394H898M971 394H1044M971 394V420" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <rect x="850" y="406" width="88" height="34" rx="10" fill="#EF4444" fill-opacity="0.22" stroke="#FCA5A5"/>
    <text x="894" y="428" text-anchor="middle" fill="#FEE2E2" font-size="12" font-weight="800">Defender</text>
    <rect x="932" y="426" width="78" height="34" rx="10" fill="#F59E0B" fill-opacity="0.22" stroke="#FCD34D"/>
    <text x="971" y="448" text-anchor="middle" fill="#FEF3C7" font-size="12" font-weight="800">Judge</text>
    <rect x="1004" y="406" width="88" height="34" rx="10" fill="#2563EB" fill-opacity="0.24" stroke="#93C5FD"/>
    <text x="1048" y="428" text-anchor="middle" fill="#DBEAFE" font-size="12" font-weight="800">Attacker</text>

    <text x="848" y="488" class="p">Route missing context to agents or users</text>
    <text x="848" y="514" class="p">Adjudicate plans, code, tests, and evidence</text>
    <text x="848" y="540" class="p">Notify human gates via page, WeChat, email</text>
  </g>

  <g class="font" filter="url(#shadow)">
    <rect x="82" y="596" width="1036" height="112" rx="20" fill="url(#glass)" stroke="#2A3A55"/>
    <text x="106" y="632" fill="#C4B5FD" class="kicker">04  COLLABORATION LAYER</text>
    <text x="106" y="656" class="h">Collaboration, Memory</text>
    <text x="106" y="684" class="h">Extension, Channels</text>

    <g>
      <rect x="426" y="621" width="112" height="32" rx="16" fill="#F59E0B" fill-opacity="0.16" stroke="#FCD34D" stroke-opacity="0.55"/>
      <text x="482" y="642" text-anchor="middle" class="chip">Workflow Agora</text>
      <rect x="550" y="621" width="100" height="32" rx="16" fill="#F59E0B" fill-opacity="0.16" stroke="#FCD34D" stroke-opacity="0.55"/>
      <text x="600" y="642" text-anchor="middle" class="chip">Topic Rooms</text>
      <rect x="662" y="621" width="112" height="32" rx="16" fill="#22C55E" fill-opacity="0.15" stroke="#86EFAC" stroke-opacity="0.55"/>
      <text x="718" y="642" text-anchor="middle" class="chip">Layered Memory</text>
      <rect x="786" y="621" width="90" height="32" rx="16" fill="#38BDF8" fill-opacity="0.14" stroke="#7DD3FC" stroke-opacity="0.55"/>
      <text x="831" y="642" text-anchor="middle" class="chip">Notebook</text>
      <rect x="888" y="621" width="94" height="32" rx="16" fill="#A78BFA" fill-opacity="0.16" stroke="#C4B5FD" stroke-opacity="0.55"/>
      <text x="935" y="642" text-anchor="middle" class="chip">Skill Market</text>
      <rect x="994" y="621" width="96" height="32" rx="16" fill="#A78BFA" fill-opacity="0.16" stroke="#C4B5FD" stroke-opacity="0.55"/>
      <text x="1042" y="642" text-anchor="middle" class="chip">Diagnostics</text>
      <rect x="426" y="664" width="156" height="30" rx="15" fill="#0EA5E9" fill-opacity="0.14" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <text x="504" y="684" text-anchor="middle" class="chip">WeChat ClawBot / Channels</text>
      <rect x="596" y="664" width="232" height="30" rx="15" fill="#0F172A" stroke="#475569"/>
      <text x="712" y="684" text-anchor="middle" class="chip">Collaborative docs / snapshots / sharing</text>
      <rect x="842" y="664" width="248" height="30" rx="15" fill="#0F172A" stroke="#475569"/>
      <text x="966" y="684" text-anchor="middle" class="chip">SDK / ACP / HTTP driver diagnostics</text>
    </g>
  </g>

  <g class="font">
    <rect x="156" y="762" width="888" height="38" rx="19" fill="#08101F" stroke="#334155"/>
    <text x="600" y="786" text-anchor="middle" fill="#CBD5E1" font-size="14" font-weight="800">Git run baselines and step-level change snapshots make AI edits observable, comparable, traceable, and rollback-ready</text>
  </g>
</svg>
