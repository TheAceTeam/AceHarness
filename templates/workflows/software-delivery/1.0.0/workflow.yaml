workflow:
  name: 软件交付
  description: 完成设计、实现、测试和交付整理
  supervisor:
    enabled: true
    agent: default-supervisor
    stageReviewEnabled: true
    checkpointAdviceEnabled: true
    scoringEnabled: true
    experienceEnabled: true
  phases:
    - name: 方案设计
      steps:
        - name: 需求与设计
          agent: architect
          task: 分析需求边界，形成实现方案、风险清单和验收标准
    - name: 编码实现
      steps:
        - name: 实现与自检
          agent: developer
          task: 按方案完成实现，保持改动聚焦并执行必要的静态检查
    - name: 测试验证
      steps:
        - name: 测试与回归
          agent: tester
          task: 补齐针对性测试，执行回归并记录结果和残余风险
    - name: 交付整理
      steps:
        - name: 交付说明
          agent: documentation-writer
          task: 汇总改动、验证结果、使用说明和已知限制
context:
  projectRoot: ""
  workspaceMode: in-place
  requirements: ""
